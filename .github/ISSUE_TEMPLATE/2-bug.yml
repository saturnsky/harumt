name: 동작 오류
description: 설치 실패, 사전 내려받기 실패, 실행 중 오류, 문서와 다른 API 동작
title: "[오류] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 번역 결과가 틀린 것은 「번역 오류 · 역어 제안」 양식으로 알려 주세요.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 일어났나요
      description: 기대한 동작과 실제 동작을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      description: 재현할 수 있는 최소한의 코드 또는 명령.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 오류 메시지 · 출력
      description: 오류 메시지 전문. 사전 설치 문제라면 `npx harumt-fetch-dictionary` 의 출력도 붙여 주세요.
      render: text
  - type: input
    id: version
    attributes:
      label: HaruMT 버전
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 환경
      description: 운영체제와 Node.js 버전. 브라우저·웹 확장이라면 브라우저와 버전.
      placeholder: "macOS 15, Node.js 22.17"
    validations:
      required: true
